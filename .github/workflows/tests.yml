# Runs the type checks and all automated tests on every change sent to the working branch (and to main).
# Render is set to deploy "After CI checks pass", so a version whose tests fail never goes live.
# The server tests are split in 6 parts that run side by side, each against its own empty Postgres
# (the same way they run locally: one shared test database, files one after another).

name: Tests

on:
  push:
    branches:
      - main
      - claude/god-nation-referral-mvp-sjpz82
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older run on the same branch: only the latest version can be deployed anyway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (type check + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        working-directory: client
        run: npx tsc --noEmit
      - name: Tests
        working-directory: client
        run: npx vitest run --reporter=dot

  server:
    name: Server tests (part ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: godnation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup refuses any database whose address does not contain "test".
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/godnation_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/godnation_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the database client
        working-directory: server
        run: npx prisma generate
      - name: Type check
        if: matrix.shard == 1
        working-directory: server
        run: npx tsc --noEmit
      - name: Tests
        working-directory: server
        run: npx vitest run --reporter=dot --shard=${{ matrix.shard }}/6
